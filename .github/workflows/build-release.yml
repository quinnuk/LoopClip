name: Build and Release LoopClip.exe

# Runs whenever you publish a GitHub Release, or manually via the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build LoopClip.exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --icon icon.ico --name LoopClip main.py

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoopClip-exe
          path: dist/LoopClip.exe

      # Only attaches to the Release when triggered by a published release
      - name: Attach exe to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoopClip.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
