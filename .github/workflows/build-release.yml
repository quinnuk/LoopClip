name: Build and Release LoopClip.exe

# Runs on every push/PR (so tests catch problems before merge), whenever
# you publish a GitHub Release, or manually via the Actions tab.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg
        with:
          ffmpeg-version: release

      - name: Basic syntax/import check
        run: |
          python -m py_compile main.py cli.py downloader.py processor.py loop_detector.py queue_manager.py settings.py tool_check.py version.py
          python -c "import cli, downloader, processor, loop_detector, queue_manager, settings, tool_check, version"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v

  build:
    name: Build
    needs: test
    # Only proceeds past the test job if it succeeded. workflow_dispatch
    # and the push/PR triggers above all still run the test job first;
    # this job then only builds after tests are green.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build LoopClip.exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --icon icon.ico --name LoopClip main.py

      - name: Verify build output
        shell: pwsh
        run: |
          $exePath = "dist\LoopClip.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Build did not produce $exePath"
            exit 1
          }
          $size = (Get-Item $exePath).Length
          if ($size -le 0) {
            Write-Error "$exePath exists but is zero bytes"
            exit 1
          }
          Write-Host "Build OK: $exePath ($size bytes)"

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoopClip-exe
          path: dist/LoopClip.exe

  release:
    name: Release
    needs: build
    if: github.event_name == 'release'
    runs-on: windows-latest

    steps:
      - name: Download built exe
        uses: actions/download-artifact@v4
        with:
          name: LoopClip-exe
          path: dist

      - name: Attach exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoopClip.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
